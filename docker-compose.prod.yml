# Staging deployment (plan sections 3.3, 3.6, 3.8).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# This is a STANDALONE file, not an overlay on docker-compose.yml. That is
# deliberate: Compose MERGES the `ports` list when you layer files, it does not
# replace it. An overlay could add a port but could never remove one, so
# `docker-compose.yml`'s `5432:5432` would survive into production and leave
# Postgres reachable. The one thing this file exists to prevent.
#
# Exposure model — only the frontend is published:
#
#   db         no published port   reachable only on the compose network
#   api        no published port   reachable only via the frontend's Nginx
#   frontend   8080                reachable at http://<vm-ip>:8080
#
# The VM sits behind VMware NAT, so 192.168.94.0/24 is reachable from the
# Windows host and from nothing else — no LAN exposure, no internet exposure.
# NAT is doing the job a firewall would otherwise have to.
#
# If this ever becomes publicly reachable, change `8080:80` back to
# "127.0.0.1:8080:80" and put a tunnel in front, so the only ingress is one
# outbound connection you control.

# Both services read config/staging.env directly. NOT `${VAR}` interpolation:
# Compose resolves those from the shell or a `.env` beside this file, never
# from `env_file:`, so `${POSTGRES_PASSWORD}` would silently expand to an
# empty string and Postgres would come up with no password at all.

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file: config/staging.env      # supplies POSTGRES_PASSWORD
    environment:
      POSTGRES_DB: notecrate
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g

  api:
    build: .
    restart: unless-stopped
    # DATABASE_URL lives in this file too, with the password written inline.
    # Keep it in sync with POSTGRES_PASSWORD — the file comments say so.
    env_file: config/staging.env
    volumes:
      # Reranker + NLI weights are ~1.8GB and download on first use. Without
      # this they are re-fetched every time the container is recreated.
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      # Importing torch and loading two cross-encoders takes a while on 2 cores.
      start_period: 300s
      retries: 5
    deploy:
      resources:
        limits:
          # Two cross-encoders resident plus the request path. Below ~2.5g the
          # OOM killer takes the container mid-query.
          memory: 3g

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      # Bound on all the VM's interfaces so the Windows host can browse to
      # http://192.168.94.128:8080. That is only reachable across the VMware
      # NAT network — see the exposure note at the top of this file.
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m

  # --- observability (plan 3.6) ---------------------------------------------
  #
  # Memory limits are deliberately small. The VM has 5.7GB total and `api`
  # alone is allowed 3GB for two resident cross-encoders; monitoring that
  # starves the thing it monitors is worse than no monitoring.
  #
  # None of these publish a port except Grafana. Prometheus and Loki are
  # reachable only on the compose network, which is also why neither has
  # authentication configured — nothing outside the VM can address them.

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 7 days on a shared 18GB disk. The default is 15d and unbounded by size.
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
      - --web.enable-lifecycle
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 384m

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./ops/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    deploy:
      resources:
        limits:
          memory: 384m

  promtail:
    image: grafana/promtail:3.3.2
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./ops/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Discovery + the log files themselves. See the socket caveat in the
      # promtail config: :ro protects the socket file, not the Docker API.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128m

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # `${VAR:-default}` interpolation is safe HERE, unlike the db block: a
      # missing value falls back to a working default instead of silently
      # becoming an empty password. Override by exporting the variables or
      # putting them in a `.env` beside this file — NOT in config/staging.env,
      # which Compose does not read for interpolation.
      #
      # Grafana is not env_file'd from staging.env on purpose: that would put
      # JWT_SECRET and the database password into the environment of a service
      # that has no use for either.
      #
      # admin/admin is acceptable only because Grafana is reachable solely
      # from the VMware NAT network. Set a real password before that changes.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  pgvector_data:
  hf_cache:
  prometheus_data:
  loki_data:
  grafana_data:
