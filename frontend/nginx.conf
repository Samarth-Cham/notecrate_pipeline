# Rate limiting (plan section 3.7): "Basic rate limiting at the reverse-proxy
# layer to prevent accidental load-test self-DDoS and simulate real
# API-gateway behavior."
#
# Behind a tunnel, $remote_addr is the tunnel's address, so every client would
# share one bucket. $http_cf_connecting_ip carries the real client IP through
# Cloudflare; the map falls back to $remote_addr when that header is absent
# (direct access, or a different tunnel).
#
# NOTE: this header is only trustworthy because nothing but the tunnel can
# reach this server — it is bound to 127.0.0.1 in docker-compose.prod.yml. On a
# publicly-bound port a client could forge it and get its own fresh bucket.
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# /query costs ~15s of CPU and a generation call, so it gets its own tiny
# budget. Login is separate and stricter still: it is the credential-stuffing
# surface, and each attempt runs a deliberately slow bcrypt comparison.
limit_req_zone $client_ip zone=query:10m  rate=6r/m;
limit_req_zone $client_ip zone=login:10m  rate=10r/m;
limit_req_zone $client_ip zone=static:10m rate=120r/m;
limit_conn_zone $client_ip zone=conns:10m;

# 429 rather than nginx's default 503 — "too many requests" is what actually
# happened, and clients can back off on it correctly.
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the exact nginx version to the internet.
    server_tokens off;

    # A question is a few hundred bytes; anything larger is not a question.
    client_max_body_size 64k;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Two concurrent requests per client. The backend is single-box with two
    # cores; more than this queues rather than parallelises.
    limit_conn conns 2;

    # Hashed asset filenames, so they can be cached indefinitely.
    location /assets/ {
        limit_req zone=static burst=40 nodelay;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        limit_req zone=static burst=20 nodelay;
        try_files $uri $uri/ /index.html;
    }

    location = /api/token {
        limit_req zone=login burst=3 nodelay;
        include /etc/nginx/conf.d/api_proxy.inc;
    }

    # Same-origin proxy to the backend. This is why the app has no CORS
    # configuration anywhere — the browser only ever talks to this origin.
    location /api/ {
        # burst without nodelay: bursts queue instead of being rejected, which
        # suits a slow endpoint a human is waiting on.
        limit_req zone=query burst=4;
        include /etc/nginx/conf.d/api_proxy.inc;
    }
}
