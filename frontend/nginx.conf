server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # Hashed asset filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy to the backend. This is why the app has no CORS
    # configuration anywhere — the browser only ever talks to this origin.
    location /api/ {
        # Service name from docker-compose.yml (the plan calls this
        # "backend-api"; the compose service is `api`).
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generation on CPU regularly exceeds Nginx's 60s default, and a
        # truncated answer looks like a backend crash from the UI.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
