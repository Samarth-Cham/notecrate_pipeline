# Provisioned at startup so the dashboard works on a fresh volume with no
# clicking. The Week 6 deliverable is a runbook someone else can follow —
# "now add a datasource by hand" is exactly the step that gets skipped.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
