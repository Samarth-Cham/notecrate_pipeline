apiVersion: 1

providers:
  - name: notecrate
    type: file
    disableDeletion: false
    # Dashboards are files in git, not clicks in a UI. Editing in Grafana is
    # allowed for exploring, but the file wins on restart — so a dashboard
    # someone tuned during an incident has to be committed to survive.
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
