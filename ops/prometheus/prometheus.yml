# Plan section 3.6: "Prometheus scrapes backend-api and llm-server metrics
# (request latency, token throughput, error rate, GPU/CPU utilization)."
#
# What is actually scrapeable here, and what is not:
#
#   backend-api   yes — src/metrics.py exposes /metrics
#   llm-server    NO  — Ollama runs on the Windows host, outside this stack,
#                       and exposes no Prometheus endpoint. Generation latency
#                       is still captured, as the `generate` stage measured
#                       inside the API, which is the number that matters to a
#                       user anyway.
#   GPU/CPU       NO  — would need node_exporter and cAdvisor. Deliberately
#                       skipped: on a 2-core VM the exporters would meaningfully
#                       compete with the thing being measured.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: staging

scrape_configs:
  - job_name: backend-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: backend-api

  # Prometheus watching itself — cheap, and it is how you notice the scraper
  # died rather than the app going quiet.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
